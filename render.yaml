databases:
  - name: axp-registry-db
    databaseName: axp_registry
    user: axp_registry_user

services:
  - type: web
    name: agent-exchange-protocol
    runtime: node
    plan: free
    buildCommand: npm install && npm run check
    preDeployCommand: npm run db:migrate
    startCommand: node agent-registry/server.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: axp-registry-db
          property: connectionString
