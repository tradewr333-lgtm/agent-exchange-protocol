[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axp-autogen"
version = "0.1.0"
description = "AutoGen adapter for Agent Exchange Protocol tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "axp-agent-sdk>=0.1.0"
]

[project.optional-dependencies]
autogen = [
  "autogen-agentchat>=0.4.0"
]

[tool.setuptools.packages.find]
where = ["src"]
