[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axp-crewai"
version = "0.1.0"
description = "CrewAI adapter for Agent Exchange Protocol tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "axp-agent-sdk>=0.1.0"
]

[project.optional-dependencies]
crewai = [
  "crewai>=0.80.0"
]

[tool.setuptools.packages.find]
where = ["src"]
