[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axp-agent-sdk"
version = "0.1.0"
description = "Python SDK for Agent Exchange Protocol registry, agents, capacity, and contracts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Agent Exchange Protocol" }
]
keywords = ["agents", "mcp", "staking", "reputation", "contracts", "axp"]
dependencies = []

[project.urls]
Homepage = "https://axp.network"
Registry = "https://registry.axp.network"
Repository = "https://github.com/tradewr333-lgtm/agent-exchange-protocol"

[tool.setuptools.packages.find]
where = ["src"]
